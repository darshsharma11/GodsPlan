name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install pnpm for P3
        run: npm install -g pnpm

      - name: Setup deployment folder
        run: mkdir -p dist/P1 dist/P2 dist/P3

      # Deploy P1 (Static HTML)
      - name: Copy P1
        run: cp -r P1/* dist/P1/

      # Deploy P2 (React / Vite)
      - name: Build P2
        working-directory: ./P2
        run: |
          npm install
          npm run build
          cp -r dist/* ../dist/P2/

      # Deploy P3 (Next.js)
      - name: Build P3
        working-directory: ./P3
        run: |
          pnpm install
          pnpm run build
          cp -r out/* ../dist/P3/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
