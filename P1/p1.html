<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Inbox</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
 
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111;
  font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  user-select: none;
}
 
/* ══════════════════════════════════
   iPHONE SHELL
══════════════════════════════════ */
.iphone {
  position: relative;
  width: 335px;
  height: 724px;
}
 
.iphone-shell {
  position: absolute;
  inset: 0;
  border-radius: 55px;
  background: linear-gradient(145deg, #3a3a3a 0%, #1a1a1a 40%, #282828 70%, #1c1c1c 100%);
  box-shadow:
    0 0 0 1px #4a4a4a,
    0 0 0 2.5px #0d0d0d,
    0 0 0 4px #333,
    0 40px 100px rgba(0,0,0,0.95),
    inset 0 1px 0 rgba(255,255,255,0.12),
    inset 0 -1px 0 rgba(0,0,0,0.6);
  transition: box-shadow 0.55s ease;
}
.iphone-shell.danger {
  box-shadow:
    0 0 0 1px #6a1a1a,
    0 0 0 2.5px #0d0d0d,
    0 0 0 4px #4a1010,
    0 40px 100px rgba(0,0,0,0.95),
    inset 0 1px 0 rgba(255,255,255,0.12),
    inset 0 -1px 0 rgba(0,0,0,0.6);
}
 
.mute     { position:absolute; left:-3.5px; top:110px; width:3.5px; height:34px; border-radius:2px 0 0 2px; background:linear-gradient(to right,#1e1e1e,#2e2e2e); }
.vol-up   { position:absolute; left:-3.5px; top:162px; width:3.5px; height:56px; border-radius:2px 0 0 2px; background:linear-gradient(to right,#1e1e1e,#2e2e2e); }
.vol-down { position:absolute; left:-3.5px; top:232px; width:3.5px; height:56px; border-radius:2px 0 0 2px; background:linear-gradient(to right,#1e1e1e,#2e2e2e); }
.power    { position:absolute; right:-3.5px; top:178px; width:3.5px; height:72px; border-radius:0 2px 2px 0; background:linear-gradient(to left,#1e1e1e,#2e2e2e); }
 
.screen {
  position: absolute;
  top:7px; left:7px; right:7px; bottom:7px;
  border-radius: 48px;

  /* IMPORTANT: real background for blur */
  background:
    linear-gradient(120deg, #1a1a1a, #2a2a2a),
    url("https://images.unsplash.com/photo-1492724441997-5dc865305da7");

  background-size: cover;
  background-position: center;

  overflow: hidden;
  isolation: isolate;
}
 
.island {
  position: absolute;
  top:12px; left:50%;
  transform: translateX(-50%);
  width:120px; height:36px;
  background: #000;
  border-radius: 20px;
  z-index: 100;
}
 
.statusbar {
  position: absolute;
  top:0; left:0; right:0; height:60px;
  display:flex; align-items:flex-end;
  padding: 0 24px 10px;
  z-index: 10;
}
.s-time { color:#fff; font-size:15px; font-weight:600; }
.s-icons { margin-left:auto; display:flex; gap:6px; align-items:center; }
 
.content {
  position: absolute;
  top:60px; left:0; right:0; bottom:30px;
  padding: 16px 22px 0;
  display: flex;
  flex-direction: column;
}
 
.hdr {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:16px; flex-shrink:0;
}
.hdr-title { color:#fff; font-size:33px; font-weight:700; letter-spacing:-1px; }
 
.trash-wrap {
  position:relative; width:40px; height:40px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  transition: background 0.2s;
}
.trash-wrap:hover { background: rgba(255,255,255,0.08); }
.trash-wrap svg { transition: stroke 0.25s; }
.trash-wrap.has-items svg { stroke: #ff453a; }
 
.badge {
  position:absolute; top:-3px; right:-3px;
  background:#2979ff; color:#fff;
  font-size:10px; font-weight:700;
  min-width:18px; height:18px; border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  padding:0 4px; opacity:0; transform:scale(0);
  pointer-events:none;
}
 
.email-list {
  border-top: 1px solid rgba(255,255,255,0.07);
  overflow:hidden; flex:1;
}
.email-row {
  display:flex; align-items:center; gap:12px;
  padding:14px 0;
  border-bottom: 1px solid rgba(255,255,255,0.055);
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
  border-radius:6px;
  transition: background 0.12s;
}
.email-row:active { background: rgba(255,255,255,0.04); }
.email-text { flex:1; min-width:0; }
.email-title {
  color:#fff; font-size:14px; font-weight:600;
  letter-spacing:-0.1px; margin-bottom:4px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.email-preview {
  color:#5a5a5a; font-size:12px; line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden;
}
 
.cb {
  width:24px; height:24px; border-radius:7px;
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(255,255,255,0.18);
  flex-shrink:0; position:relative;
  transition: background 0.18s, border-color 0.18s;
}
.cb.on { background:#2979ff; border-color:#2979ff; }
.cb svg { position:absolute; inset:0; margin:auto; width:14px; height:14px; display:block; overflow:visible; }
.ck {
  stroke:#fff; stroke-width:2.4;
  stroke-linecap:round; stroke-linejoin:round; fill:none;
  stroke-dasharray:20; stroke-dashoffset:20;
  transition: stroke-dashoffset 0.22s cubic-bezier(.4,0,.2,1);
}
.cb.on .ck { stroke-dashoffset:0; }
 
.home-bar {
  position:absolute; bottom:9px; left:50%;
  transform:translateX(-50%);
  width:130px; height:4px;
  background:rgba(255,255,255,0.25); border-radius:3px;
}
 
/* ══════════════════════════════════════════════════════
   RED OVERLAY  — 5 effects stacked
 
   Effect 1 ▸ LINEAR GRADIENT   — vertical dark→mid→dark red sweep
   Effect 2 ▸ RGBA TRANSPARENT  — 0.72 opacity centre so content shows through
   Effect 3 ▸ BACKDROP BLUR     — blurs inbox list underneath (frosted glass)
   Effect 4 ▸ RADIAL GRADIENT   — 4-corner warm orange bloom (::before)
   Effect 5 ▸ SOFT SHADOW+BORDER— iOS screen rim shine (::after)
══════════════════════════════════════════════════════ */
.overlay {
  position:absolute; inset:0; border-radius:48px;
  z-index:40; pointer-events:none; opacity:0;

  /* MUCH lighter tint */
  background: linear-gradient(
    180deg,
    rgba(255, 40, 20, 0.18) 0%,
    rgba(255, 60, 30, 0.22) 50%,
    rgba(120, 0, 0, 0.28) 100%
  );

  /* reduce blur slightly */
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
}
 
/* Radial gradient light blooms */
.overlay::before {
  content:'';
  position:absolute; inset:0; border-radius:inherit;

  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,0.12), transparent 40%),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,0.08), transparent 50%);

  mix-blend-mode: overlay;
}
 
/* Dark vignette edges for depth */
.overlay::after {
  content:'';
  position:absolute; inset:0; border-radius:inherit;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.25);
}
 
/* ══════════════════════════════════════════════════════
   DELETE MODAL  — frosted glass card
 
   Effect 1 ▸ LINEAR GRADIENT   — top-bright → bottom-dim white sheen
   Effect 2 ▸ RADIAL GRADIENT   — top-centre gloss highlight blob
   Effect 3 ▸ RGBA TRANSPARENT  — 0.18–0.07 white so red bleeds through card
   Effect 4 ▸ BACKDROP BLUR     — blurs red overlay behind the card
   Effect 5 ▸ BORDER+BOX-SHADOW — glass edge rim + multi-layer soft shadow
══════════════════════════════════════════════════════ */
.modal {
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%) scale(0.4);
  z-index:50; opacity:0; pointer-events:none;
  width:280px;
  text-align:center; padding:20px;
 
  /* NO visible box */
  background: transparent;
  border: none;
  box-shadow: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
.modal.open { pointer-events:all; }
 
.modal-n {
  color:#fff; font-size:27px; font-weight:700;
  letter-spacing:-0.7px; margin-bottom:10px;
  text-shadow: 0 1px 14px rgba(0,0,0,0.45);
}
.modal-msg {
  color:rgba(255,255,255,0.80); font-size:13px;
  line-height:1.56; margin-bottom:26px;
  text-shadow: 0 1px 6px rgba(0,0,0,0.25);
}
 
.btn-del {
  display:block; width:100%; padding:15px 0;
  border-radius:50px; border:none; outline:none;
  cursor:pointer; font-size:16px; font-weight:700;
  color:#111; letter-spacing:-0.2px; margin-bottom:14px;
  -webkit-tap-highlight-color:transparent;
  background: linear-gradient(180deg, #ffffff 0%, #efefef 100%);
  box-shadow:
    0 5px 22px rgba(0,0,0,0.32),
    0 1px  5px rgba(0,0,0,0.20),
    inset 0 1px 0 rgba(255,255,255,1.0);
  transition: transform 0.1s, box-shadow 0.1s;
}
.btn-del:active {
  transform:scale(0.96);
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
 
.btn-cxl {
  color:rgba(255,255,255,0.86); font-size:15px; font-weight:500;
  cursor:pointer; padding:6px 16px; display:inline-block;
  -webkit-tap-highlight-color:transparent;
  text-shadow: 0 1px 6px rgba(0,0,0,0.30);
  transition:opacity 0.15s;
}
.btn-cxl:active { opacity:0.5; }
 
.hint {
  position:absolute; bottom:-34px; left:50%;
  transform:translateX(-50%);
  white-space:nowrap; color:rgba(255,255,255,0.28); font-size:12px;
}
</style>
</head>
<body>
 
<div class="iphone">
  <div class="iphone-shell" id="shell"></div>
  <div class="mute"></div><div class="vol-up"></div>
  <div class="vol-down"></div><div class="power"></div>
 
  <div class="screen">
    <div class="island"></div>
 
    <div class="statusbar">
      <span class="s-time">9:41</span>
      <div class="s-icons">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff">
          <rect x="0"    y="8"   width="3" height="4"   rx="0.8" opacity="0.35"/>
          <rect x="4.5"  y="5.5" width="3" height="6.5" rx="0.8" opacity="0.6"/>
          <rect x="9"    y="3"   width="3" height="9"   rx="0.8" opacity="0.82"/>
          <rect x="13.5" y="0"   width="3" height="12"  rx="0.8"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 20 14" fill="none">
          <circle cx="10" cy="13" r="1.6" fill="#fff"/>
          <path d="M6.5 9.5Q10 7 13.5 9.5"    stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M3.5 6.5Q10 2.5 16.5 6.5"  stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M1 3.5Q10 -1 19 3.5"        stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
          <rect x="0.6" y="0.6" width="21.8" height="10.8" rx="2.5" stroke="#fff" stroke-width="1.2"/>
          <rect x="1.8" y="1.8" width="17"   height="8.4"  rx="1.8" fill="#fff"/>
          <path d="M23.2 4Q25.5 5.8 23.2 8" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
 
    <div class="content">
      <div class="hdr">
        <span class="hdr-title">Inbox</span>
        <div class="trash-wrap" id="trashBtn">
          <div class="badge" id="badge">0</div>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="rgba(255,255,255,0.72)" stroke-width="1.75"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
          </svg>
        </div>
      </div>
      <div class="email-list" id="emailList"></div>
    </div>
 
    <div class="overlay" id="overlay"></div>
 
    <div class="modal" id="modal">
      <div class="modal-n" id="modalN">3 items</div>
      <div class="modal-msg">Are you sure you want to delete these entries? You can't undo this action.</div>
      <button class="btn-del" id="btnDel">Delete</button>
      <div class="btn-cxl" id="btnCxl">Cancel</div>
    </div>
 
    <div class="home-bar"></div>
  </div>
 
  <div class="hint">Tap any row to select &rarr; tap 🗑 to delete</div>
</div>
 
<script>
const EMAILS = [
  { t:'Weekly team update',             p:"Hi team, Just a quick update on our progress this week. We've made significant strides in th..." },
  { t:'Your subscription confirmation', p:"Thank you for subscribing to our newsletter! You'll now receive updates about our latest..."    },
  { t:'Invoice #1234 for April',        p:"Your monthly invoice is now available. Please find attached the detailed breakdown of your..."   },
  { t:'Security alert: New login',      p:"We detected a new sign-in to your account from a new device or location. If this was you,..."   },
  { t:'Upcoming maintenance notice',    p:"Please be advised that our platform will undergo scheduled maintenance this weeken..."           },
];
 
const list     = document.getElementById('emailList');
const badge    = document.getElementById('badge');
const trashBtn = document.getElementById('trashBtn');
const overlay  = document.getElementById('overlay');
const modal    = document.getElementById('modal');
const modalN   = document.getElementById('modalN');
const btnDel   = document.getElementById('btnDel');
const btnCxl   = document.getElementById('btnCxl');
const shell    = document.getElementById('shell');
 
let selected = new Set();
let isOpen   = false;
 
EMAILS.forEach((e, i) => {
  const row = document.createElement('div');
  row.className = 'email-row';
  row.dataset.i = i;
  row.innerHTML = `
    <div class="email-text">
      <div class="email-title">${e.t}</div>
      <div class="email-preview">${e.p}</div>
    </div>
    <div class="cb" id="cb${i}">
      <svg viewBox="0 0 14 14" overflow="visible">
        <path class="ck" d="M2.5 7 L5.5 10 L11.5 4"/>
      </svg>
    </div>`;
  row.addEventListener('click', () => { if (!isOpen) toggle(i); });
  list.appendChild(row);
});
 
function toggle(i) {
  const cb = document.getElementById('cb' + i);
  if (selected.has(i)) {
    selected.delete(i);
    cb.classList.remove('on');
    gsap.fromTo(cb, { scale:0.8 }, { scale:1, duration:0.28, ease:'back.out(3)' });
  } else {
    selected.add(i);
    cb.classList.add('on');
    gsap.fromTo(cb, { scale:0.7 }, { scale:1, duration:0.35, ease:'back.out(4)' });
  }
  syncUI();
}
 
function syncUI() {
  const n = selected.size;
  badge.textContent = n;
  if (n > 0) {
    gsap.to(badge, { opacity:1, scale:1, duration:0.25, ease:'back.out(3)' });
    trashBtn.classList.add('has-items');
  } else {
    gsap.to(badge, { opacity:0, scale:0, duration:0.18, ease:'power2.in' });
    trashBtn.classList.remove('has-items');
  }
}
 
trashBtn.addEventListener('click', () => {
  if (isOpen || selected.size === 0) return;
  isOpen = true;
  const n = selected.size;
  modalN.textContent = n === 1 ? '1 item' : `${n} items`;
  modal.classList.add('open');
 
  /* True iOS-style dynamic blur overlay animation */
  gsap.fromTo(overlay, 
    { opacity: 0, backdropFilter: 'blur(0px) saturate(120%)', WebkitBackdropFilter: 'blur(0px) saturate(120%)' },
    { opacity: 1, backdropFilter: 'blur(14px) saturate(150%)', WebkitBackdropFilter: 'blur(14px) saturate(150%)', duration: 0.4, ease: 'power2.out' }
  );
 
  /* iPhone outer glow */
  shell.classList.add('danger');
 
  /* Native-feeling modal pop with gentle overshoot spring */
  gsap.fromTo(modal,
    { opacity: 0, scale: 0.88, y: 20 },
    { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: 'back.out(1.4)', delay: 0.08 }
  );
 
  gsap.timeline()
    .to(trashBtn, { scale:1.28, duration:0.1, ease:'power2.out' })
    .to(trashBtn, { scale:1.00, duration:0.22, ease:'back.out(3)' });
});
 
function closeModal(doDelete) {
  gsap.to(modal, {
    opacity: 0, scale: 0.92, y: 15,
    duration: 0.28, ease: 'power2.inOut',
    onComplete: () => modal.classList.remove('open')
  });

  gsap.to(overlay, {
    opacity: 0, backdropFilter: 'blur(0px) saturate(120%)', WebkitBackdropFilter: 'blur(0px) saturate(120%)',
    duration: 0.32, ease: 'power2.inOut',
    delay: 0.04,
    onComplete() {
      shell.classList.remove('danger');
      if (doDelete) deleteRows(); else isOpen = false;
    }
  });
}
 
function deleteRows() {
  const rows = [...list.querySelectorAll('.email-row')]
    .filter(r => selected.has(+r.dataset.i));
  gsap.to(rows, {
    opacity:0, x:-20, height:0,
    paddingTop:0, paddingBottom:0, borderBottomWidth:0,
    duration:0.3, stagger:0.05, ease:'power2.inOut',
    onComplete() {
      rows.forEach(r => r.remove());
      selected.clear(); syncUI(); isOpen = false;
    }
  });
}
 
btnDel.addEventListener('click', () => closeModal(true));
btnCxl.addEventListener('click', () => closeModal(false));
overlay.addEventListener('click', () => { if (isOpen) closeModal(false); });
</script>
</body>
</html>
